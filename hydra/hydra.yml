# 秘密値（DSN、SECRETS_SYSTEM、pairwise salt）は compose の環境変数で渡す
serve:
  cookies:
    same_site_mode: Lax

urls:
  self:
    issuer: http://localhost:4444
  login: http://localhost:8081/login
  consent: http://localhost:8081/consent

oidc:
  subject_identifiers:
    supported_types:
      - public

ttl:
  # 認可コードはブローカーや RP のアクセスログに残りうるので短くする（既定 10m）
  auth_code: 1m
  id_token: 1h
  access_token: 1h
  refresh_token: 720h
  login_consent_request: 30m

oauth2:
  pkce:
    enforced: true

log:
  level: info
  leak_sensitive_values: false
